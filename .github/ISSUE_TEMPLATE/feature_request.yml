name: Feature request
description: Propose a focused enhancement to K'sRouter.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe a concrete workflow that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain expected behavior, not just the implementation.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Compatibility, risks, and alternatives
      description: Note relevant security, maintenance, dependency, and performance trade-offs.
